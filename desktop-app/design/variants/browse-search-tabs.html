<!doctype html><meta charset="utf-8"><title>Browse · a Search tab that keeps the filters</title>
<!-- Uses the app's stylesheet. Covers come from AniList's CDN (the same URLs as src/devBrowseFixtures.ts), so capturing needs a connection. -->
<link rel="stylesheet" href="../../src/styles.css">
<style>
html, body { height: auto; }
body { background:#121315; padding: 40px 0 80px; min-width: 0; }
.caption { width: 1000px; margin: 56px 60px 12px; color: #85878c; font-size: 12.5px; line-height: 1.55; }
.caption:first-child { margin-top: 0; }
.caption b { color: #d6d7da; font-weight: 600; }
.caption i { color: #a9abb0; font-style: normal; }
.variant { position: relative; width: 1240px; background: var(--bg); padding: 0 0 34px; }
.variant .bar { padding: 0 60px; }
.variant .section { margin: 12px 60px 0; }
.variant * { animation: none !important; }
/* ---- shared: heading line with plain-text sort, like the schedule's day tabs ---- */
.bx-sub { color: var(--muted); font-size: 13px; }
.bx-sort { display: flex; gap: 18px; margin-left: auto; }
.bx-sort button { color: var(--muted); font-size: 14px; }
.bx-sort button:hover { color: var(--text); }
.bx-sort button.on { color: var(--text); font-weight: 500; }
.chev { width: 10px; height: 10px; flex: none; opacity: .7; }

/* ---- shared: three-state genre chip (off, include, exclude) ---- */
.bx-genres { display: flex; flex-wrap: wrap; gap: 6px; }
.g { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 7px; background: var(--raised); color: var(--muted); font-size: 12.5px; }
.g:hover { color: var(--text); background: var(--raised2); }
.g.inc { background: var(--cursor); color: var(--cursor-text); font-weight: 500; }
.g.exc { background: none; box-shadow: 0 0 0 1px var(--rule) inset; color: var(--dim); text-decoration: line-through; }
.g.exc::before { content: "−"; text-decoration: none; display: inline-block; color: var(--danger); }

/* ---- shared: card additions on top of .card ---- */
.bx-grid { margin-top: 20px; }
.card .badges.top { top: 8px; bottom: auto; justify-content: flex-end; }
.card.is-resolving .poster { box-shadow: 0 0 0 2px var(--cursor); }
.card.is-resolving .poster img { filter: brightness(.55); }
.card.is-waiting { opacity: .45; }

/* ---- shared: load more ---- */
.bx-more { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 28px; color: var(--dim); font-size: 12.5px; }
.bx-ghosts { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 18px 16px; margin-top: 18px; -webkit-mask-image: linear-gradient(#000 10%, transparent 90%); mask-image: linear-gradient(#000 10%, transparent 90%); }

/* ---- B1 · quiet strip ---- */
.b1-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; min-height: 28px; }
.b1-toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
.b1-toggle.open, .b1-toggle:hover { color: var(--text); }
.b1-toggle.open .chev { transform: rotate(180deg); }
.token { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 9px; border-radius: 7px; background: var(--raised); color: var(--text); font-size: 12px; }
.token span { color: var(--dim); font-size: 13px; line-height: 1; }
.b1-clear { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.b1-panel { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-top: 12px; padding: 16px 18px; border-radius: 12px; background: color-mix(in oklab, var(--bg), var(--text) 3%); }
.b1-panel .chips-row { gap: 10px; }
.mini { width: 58px; height: 30px; padding: 0 9px; border-radius: 8px; background: var(--raised); color: var(--text); font-size: 13px; text-align: center; }
.mini.wide { width: 72px; }
.dash { color: var(--dim); }


.g { border-radius: 7px; }
.search.focus { background: var(--raised2); box-shadow: 0 0 0 1px var(--rule); }
.search .typed { flex: 1; font-size: 15px; color: var(--text); }
.search .typed::after { content: ""; display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--cursor); }
.search .hint { flex: 1; font-size: 15px; color: var(--dim); }
.token.term { color: var(--text); }
.bx-sort button.dimmed { color: var(--dim); }
.bx-none { padding: 34px 0 10px; color: var(--muted); }
.bx-none b { display: block; margin-bottom: 4px; color: var(--text); font-size: 15px; font-weight: 600; }
.bx-none .fixes { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.bx-none .fixes .link { margin-left: 10px; color: var(--text); text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; font-size: 13px; }
/* S2 · a field of its own on the filters line */
.s2-field { display: inline-flex; align-items: center; gap: 8px; width: 240px; height: 30px; margin-left: auto; padding: 0 10px; border-radius: 8px; background: var(--raised); color: var(--muted); font-size: 13px; }
.s2-field .icon { width: 14px; height: 14px; }
.s2-field span { color: var(--text); }
.s2-field span::after { content: ""; display: inline-block; width: 1.5px; height: 14px; margin-left: 1px; vertical-align: -2px; background: var(--cursor); }
.s2-field + .b1-clear { margin-left: 14px; }
/* S3 · tabs under the heading */
.s3-tabs { display: flex; gap: 20px; margin-left: 18px; }
.s3-tabs button { color: var(--muted); font-size: 14px; }
.s3-tabs button.on { color: var(--text); font-weight: 500; }
.s3-big { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; border-radius: 12px; background: var(--raised); color: var(--muted); font-size: 15px; }
.s3-big span { color: var(--text); }
.s3-big span::after { content: ""; display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--cursor); }
.s3-note { margin: 10px 0 0; color: var(--dim); font-size: 12.5px; }

/* T1 · heading-sized word tabs */
.t1-tabs { display: flex; align-items: baseline; gap: 18px; }
.t1-tabs h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.t1-tabs h2.off { color: var(--dim); }
.t-field { display: flex; align-items: center; gap: 12px; height: 44px; margin-bottom: 14px; padding: 0 12px 0 16px; border-radius: 12px; background: var(--raised2); box-shadow: 0 0 0 1px var(--rule); color: var(--muted); font-size: 15px; }
.t-field .typed { flex: 1; color: var(--text); }
.t-field .typed::after, .t-inline .typed::after { content: ""; display: inline-block; width: 1.5px; height: 1.15em; margin-left: 1px; vertical-align: -3px; background: var(--cursor); }
.t-field .ph { flex: 1; color: var(--dim); }
.t-field .ph::before { content: ""; display: inline-block; width: 1.5px; height: 17px; margin-right: 1px; vertical-align: -3px; background: var(--cursor); }
.t-field .x, .t-inline .x { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--muted); }
.t-field .x .icon, .t-inline .x .icon { width: 15px; height: 15px; }
.t-note { margin: 22px 0 0; color: var(--muted); font-size: 13px; }
.t-note b { color: var(--text); font-weight: 600; margin-right: 8px; }
.dimmed { opacity: .45; }
.t-ghosts { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 18px 16px; margin-top: 20px; -webkit-mask-image: linear-gradient(90deg, #000 30%, transparent 96%); mask-image: linear-gradient(90deg, #000 30%, transparent 96%); }
/* T2 · small tabs, field on the heading line */
.t-inline { display: inline-flex; align-items: center; gap: 8px; width: 300px; height: 32px; margin-left: 6px; padding: 0 4px 0 11px; border-radius: 9px; background: var(--raised2); box-shadow: 0 0 0 1px var(--rule); color: var(--muted); font-size: 13.5px; align-self: center; }
.t-inline .icon { width: 15px; height: 15px; }
.t-inline .typed { flex: 1; color: var(--text); }
.t-inline.rest { background: var(--raised); box-shadow: none; }
.t-inline.rest .ph { flex: 1; color: var(--dim); }
/* T3 · results header */
.t3-back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
.t3-back .icon { width: 14px; height: 14px; }
</style>
<script>
const D = [
 ["Frieren: Beyond Journey's End","bx154587-qQTzQnEJJ3oB.jpg","TV",2023,91,28,["Adventure","Drama","Fantasy"]],
 ["Attack on Titan","bx16498-buvcRTBx4NSm.jpg","TV",2013,85,25,["Action","Drama","Fantasy","Mystery"]],
 ["Demon Slayer: Kimetsu no Yaiba","bx101922-WBsBl0ClmgYL.jpg","TV",2019,82,26,["Action","Adventure","Drama","Fantasy","Supernatural"]],
 ["JUJUTSU KAISEN","bx113415-LHBAeoZDIsnF.jpg","TV",2020,84,24,["Action","Drama","Supernatural"]],
 ["Death Note","bx1535-kUgkcrfOrkUM.jpg","TV",2006,84,37,["Mystery","Psychological","Supernatural","Thriller"]],
 ["My Hero Academia","bx21459-nYh85uj2Fuwr.jpg","TV",2016,76,13,["Action","Adventure","Comedy"]],
 ["Hunter x Hunter (2011)","bx11061-y5gsT1hoHuHw.png","TV",2011,89,148,["Action","Adventure","Fantasy"]],
 ["One-Punch Man","bx21087-B5DHjqZ3kW4b.jpg","TV",2015,83,12,["Action","Comedy","Sci-Fi","Supernatural"]],
 ["ONE PIECE","bx21-ELSYx3yMPcKM.jpg","TV",1999,87,0,["Action","Adventure","Comedy","Drama","Fantasy"]],
 ["Tokyo Ghoul","b20605-k665mVkSug8D.jpg","TV",2014,76,12,["Action","Drama","Horror","Mystery"]],
 ["Attack on Titan Season 2","bx20958-HuFJyr54Mmir.jpg","TV",2017,85,12,["Action","Drama","Fantasy","Mystery"]],
 ["Fullmetal Alchemist: Brotherhood","bx5114-nSWCgQlmOMtj.jpg","TV",2009,90,64,["Action","Adventure","Drama","Fantasy"]],
 ["Naruto","bx20-dE6UHbFFg1A5.jpg","TV",2002,80,220,["Action","Adventure","Comedy","Drama","Fantasy"]],
 ["Sword Art Online","bx11757-SxYDUzdr9rh2.jpg","TV",2012,70,25,["Action","Adventure","Fantasy","Romance"]],
 ["A Silent Voice","bx20954-sYRfE5jQRtSB.jpg","MOVIE",2016,88,1,["Drama","Romance","Slice of Life"]],
 ["Your Name.","bx21519-SUo3ZQuCbYhJ.png","MOVIE",2016,85,1,["Drama","Romance","Supernatural"]],
 ["Attack on Titan Season 3","bx99147-AiPDD8cwlCfi.jpg","TV",2018,86,12,["Action","Drama","Fantasy","Mystery"]],
 ["Attack on Titan Final Season","bx110277-sKUNXAsWMNFw.jpg","TV",2021,87,16,["Action","Drama","Fantasy","Mystery"]],
 ["Chainsaw Man","bx127230-DdP4vAdssLoz.png","TV",2022,83,12,["Action","Drama","Horror","Supernatural"]],
 ["Assassination Classroom","bx20755-dWrhs569YGUO.jpg","TV",2015,79,22,["Action","Comedy","Drama","Supernatural"]],
 ["Mob Psycho 100","bx21507-6YUSbh2m0N1p.jpg","TV",2016,84,12,["Action","Comedy","Drama","Psychological"]],
 ["Re:ZERO -Starting Life in Another World-","bx21355-wRVUrGxpvIQQ.jpg","TV",2016,81,25,["Action","Adventure","Drama","Fantasy"]]
].map(([t,c,k,y,s,e,g]) => ({ t, c:"https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/"+c, k, y, s, e, g }));

const T = D.filter(x => /titan/i.test(x.t));
const GENRES = ["Action","Adventure","Comedy","Drama","Ecchi","Fantasy","Horror","Mahou Shoujo","Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life","Sports","Supernatural","Thriller"];
const svg = (d) => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = { search:`<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>`, home:`<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>`, browse:`<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9z"/>`, bookmark:`<path d="M6 4h12v17l-6-4-6 4z"/>`, clock:`<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>`, gear:`<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 3.6"/>`, x:`<path d="M6 6l12 12M18 6 6 18"/>` };
const chev = `<svg class="chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg>`;
// pill: "button" is today's jump-to-home button, "hint" the scoped placeholder, anything else is typed text.
const bar = (pill, text) => `<header class="bar"><div class="brand"><button class="logo">ANI<em>desktop</em></button></div><div class="searchbox">${
  pill==="button" ? `<button class="search as-button">${svg(I.search)}<span>Search anime</span><kbd>⌘K</kbd></button>`
  : pill==="hint" ? `<label class="search">${svg(I.search)}<span class="hint">Search the AniList catalog</span><kbd>⌘K</kbd></label>`
  : `<label class="search focus">${svg(I.search)}<span class="typed">${text}</span><button class="clear">${svg(I.x)}</button></label>`
}</div><nav class="icons">${["home","browse","bookmark","clock","gear"].map(n=>`<button class="${n==="browse"?"on":""}">${svg(I[n])}</button>`).join("")}</nav></header>`;
const format = k => k==="MOVIE" ? "Movie" : k;
const card = (x) => `<div class="card"><button class="hit"><span class="art poster"><img class="in" src="${x.c}"></span><span class="badges top"><span class="badge">${(x.s/10).toFixed(1)}</span></span></button><span class="t">${x.t}</span><span class="s">${[format(x.k), x.y, x.e ? (x.e===1?"":x.e+" eps") : "airing"].filter(Boolean).join(" · ")}</span><span class="tags">${x.g.slice(0,2).map(g=>`<span class="tag">${g}</span>`).join("")}${x.g.length>2?`<span class="tag more">+${x.g.length-2}</span>`:""}</span></div>`;
const grid = (items, n=8) => `<div class="cards bx-grid">${items.slice(0,n).map(card).join("")}</div>`;
const sort = (on, best) => `<div class="bx-sort">${(best?["Best match"]:[]).concat(["Popular","Top rated","Newest","A–Z"]).map(s=>`<button class="${s===on?"on":""}">${s}</button>`).join("")}</div>`;
const head = (right, extra="") => `<div class="section-head"><h2>Browse</h2>${extra || `<span class="bx-sub">AniList catalog</span>`}${right}</div>`;
const genres = (inc=[]) => `<div class="bx-genres">${GENRES.map(g=>`<button class="g ${inc.includes(g)?"inc":""}">${g}</button>`).join("")}</div>`;
const line = (tokens, tail="") => `<div class="b1-line"><button class="b1-toggle">Filters ${chev}</button>${tokens.map(t=>`<span class="token">${t} <span>×</span></span>`).join("")}${tail}${tokens.length?`<button class="b1-clear" ${tail?'style="margin-left:14px"':""}>Clear all</button>`:""}</div>`;
const shown = (n) => `<div class="bx-more"><span>All ${n} shown</span></div>`;
const V = (name, barHtml, body) => `<div class="variant" data-variant="${name}">${barHtml}<section class="section">${body}</section></div>`;
const cap = (html) => `<div class="caption">${html}</div>`;


const back = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>`;
const x = `<button class="x">${svg(I.x)}</button>`;
const bigField = (text) => `<label class="t-field">${svg(I.search)}${text ? `<span class="typed">${text}</span>${x}` : `<span class="ph">Search the AniList catalog by title</span>`}</label>`;
const t1head = (tab, right) => `<div class="section-head"><div class="t1-tabs"><h2 class="${tab==="catalog"?"":"off"}">Browse</h2><h2 class="${tab==="search"?"":"off"}">Search</h2></div>${right}</div>`;
const t2head = (tab, mid, right) => `<div class="section-head"><h2>Browse</h2><div class="s3-tabs" style="margin-left:8px"><button class="${tab==="catalog"?"on":""}">Catalog</button><button class="${tab==="search"?"on":""}">Search</button></div>${mid}${right}</div>`;
const hi = T.filter(x=>x.s>=86);

document.write(
  cap(`<b>What all three share.</b> The top pill stays as it is on every screen. Search is a second space inside Browse with the same genre chips, Filters panel, tokens, sort, "Show more", and in-place opening. It keeps a state of its own (term, filters, loaded pages, scroll), so a search never disturbs the catalog you were filtering, and coming back to either one restores it. In code this is the same <i>BrowseScreen</i> given a second <i>BrowseViewState</i> and an optional <i>search</i> field on <i>BrowseFilters</i>; the main process gains one query variable.`) +

  cap(`<b>T1 · Heading words as tabs. Catalog side.</b> "Browse" and "Search" share the heading line at heading size; the one you are in is lit. It costs no extra row and reads as two rooms of one page. This is the catalog as it is today.`) +
  V("t1-catalog", bar("button"), t1head("catalog", sort("Popular")) + genres(["Fantasy"]) + line([]) + grid(D.filter(x=>x.g.includes("Fantasy")))) +

  cap(`<b>T1 · Search, before typing.</b> Clicking "Search" focuses a full-width field. The chips and filters are already there, stepped back until a term exists, so the page keeps its shape. The catalog side still holds its Fantasy filter.`) +
  V("t1-empty", bar("button"), t1head("search", `<div class="bx-sort dimmed">${["Best match","Popular","Top rated","Newest","A–Z"].map((s,i)=>`<button class="${i?"":"on"}">${s}</button>`).join("")}</div>`) + bigField("") + `<div class="dimmed">${genres()}${line([])}</div><div class="t-ghosts">${"<span class='ghost'></span>".repeat(8)}</div><p class="t-note"><b>Search by title</b>English, romaji, and native titles all match. Genres and filters narrow the results.</p>`) +

  cap(`<b>T1 · Search, narrowed.</b> "titan" with Action included and a score from 8.6, sorted by best match. One request carries the term and the filters together.`) +
  V("t1-typed", bar("button"), t1head("search", sort("Best match", true)) + bigField("titan") + genres(["Action"]) + line(["Score 8.6+"]) + grid(hi) + shown(hi.length)) +

  cap(`<b>T2 · Small tabs, field on the heading line.</b> Quieter text tabs beside the heading, and the field sits where the "AniList catalog" note was, so Search is exactly as tall as Catalog and the grid never moves when you switch. The field is smaller, and the heading line gets busy: title, tabs, field, five sort words.`) +
  V("t2-typed", bar("button"), t2head("search", `<label class="t-inline">${svg(I.search)}<span class="typed">titan</span>${x}</label>`, sort("Best match", true)) + genres(["Action"]) + line(["Score 8.6+"]) + grid(hi) + shown(hi.length)) +

  cap(`<b>T3 · No tabs: a labelled field that opens a results space.</b> The catalog's heading line always carries a small "Search titles" field (first frame). Typing swaps the page to the results space (second frame): a "Catalog" crumb leads back, and clearing the field does the same. One fewer control than tabs; the second space is invisible until you type, and its separate filters may surprise someone who expected the catalog's filters to carry over.`) +
  V("t3-rest", bar("button"), `<div class="section-head"><h2>Browse</h2><label class="t-inline rest">${svg(I.search)}<span class="ph">Search titles</span></label>${sort("Popular")}</div>` + genres(["Fantasy"]) + line([]) + grid(D.filter(x=>x.g.includes("Fantasy")))) +
  V("t3-typed", bar("button"), `<button class="t3-back">${back}Catalog</button><div class="section-head" style="margin-top:6px"><h2>Search</h2><label class="t-inline">${svg(I.search)}<span class="typed">titan</span>${x}</label>${sort("Best match", true)}</div>` + genres(["Action"]) + line(["Score 8.6+"]) + grid(hi) + shown(hi.length))
);
</script>
