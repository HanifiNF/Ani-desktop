<!doctype html><meta charset="utf-8"><title>Search field on the series page</title>
<!-- Uses the app's stylesheet, so the bar, field, and palette are the real ones. Each variant shows the series page at rest, then the same page after a click on the field. -->
<link rel="stylesheet" href="../../src/styles.css">
<style>
:root { --theme-bg: #262626; --theme-text: #EFE6D0; --theme-cursor: #F0BC42; --cursor-text: #1d1a12; }
html, body { height: auto; }
body { background:#151515; padding: 40px 0 80px; min-width: 0; display: block; }
.caption { width: 1000px; margin: 56px 60px 12px; color: #8a8578; font-size: 12.5px; line-height: 1.55; }
.caption:first-child { margin-top: 0; }
.caption b { color: #d8cfba; font-weight: 600; }
.variant { width: 1240px; padding: 0 0 8px; }
.variant * { animation: none !important; }
.state { display: block; margin: 22px 60px 10px; color: #8a8578; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.frame { position: relative; width: 1240px; height: 300px; overflow: hidden; background: var(--bg); }
.frame.tall { height: 470px; }
.frame .page { padding: 0 var(--gutter); }
.frame .series { margin-top: 12px; }
.frame .poster { width: 240px; height: 360px; border-radius: var(--radius); background: linear-gradient(160deg, #3d5a8a, #6fa3c7 45%, #2a3358); }
.frame .facts { display: flex; gap: 34px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.frame .facts div { display: grid; gap: 6px; font-size: 14px; }
.frame .facts small { color: var(--muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.frame .lines { display: grid; gap: 9px; margin-top: 18px; }
.frame .lines i { display: block; height: 9px; border-radius: 4px; background: var(--raised); }
.thumb .art { background: linear-gradient(160deg, var(--a), var(--b)); }

/* the states being mocked */
.search input.selected::selection { background: color-mix(in oklab, var(--cursor), transparent 60%); }
.sel { background: color-mix(in oklab, var(--cursor), transparent 62%); color: var(--text); border-radius: 2px; padding: 1px 0; }
.fake-input { flex: 1; font-size: 15px; color: var(--text); min-width: 0; white-space: nowrap; }
.fake-input.rest { color: var(--muted); }
.fake-input .ph { color: var(--dim); }
.caret { display: inline-block; width: 1px; height: 17px; margin-left: 1px; background: var(--text); vertical-align: -3px; }
.count { flex: none; color: var(--dim); font-size: 12px; }
.recall { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 8px; border-radius: 10px; color: var(--text); font-size: 14px; background: var(--raised2); box-shadow: 0 0 0 1px var(--rule); }
.recall .icon { color: var(--muted); }
.recall .q { flex: 1; text-align: left; }
.recall .n { color: var(--muted); font-size: 12px; }
</style>
<body>
<script>
const P = { search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', home:'<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>', browse:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9z"/>', bookmark:'<path d="M6 4h12v17l-6-4-6 4z"/>', clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', gear:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3.3"/>', chevron:'<path d="m9 6 6 6-6 6"/>', back:'<path d="m15 6-6 6 6 6"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', copy:'<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/>' };
const icon = (n) => `<svg class="icon icon-${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const clear = `<button type="button" class="clear">${icon("x")}</button>`;
const kbd = `<kbd>⌘K</kbd>`;

const HITS = [["Frieren: Beyond Journey's End", "#3d5a8a", "#6fa3c7"], ["Frieren: Beyond Journey's End Season 2", "#e9e4dc", "#b8413a"], ["Frieren: Beyond Journey's End Mini Anime", "#4f7a3a", "#a9c77a"]];
const hit = ([title, a, b], cur) => `<div class="hit-row ${cur ? "cur" : ""}"><button type="button" class="hit"><span class="thumb"><span class="art" style="--a:${a};--b:${b}"></span></span><span class="text"><span class="t">${title}</span><span class="srcs"><span class="tag">aniwave</span> <span class="tag">hianime</span></span></span>${icon("chevron")}</button></div>`;
const results = (cur = 0) => `<div class="palette"><div class="found">3 results for "frieren"</div><div class="section-results">${HITS.map((h, i) => hit(h, i === cur)).join("")}</div><div class="foot-hints"><span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>esc</b> back to the series</span></div></div>`;
const recall = `<div class="palette"><div class="found">Last search</div><div class="section-results"><button type="button" class="recall">${icon("search")}<span class="q">frieren</span><span class="n">3 results</span>${icon("chevron")}</button></div><div class="foot-hints"><span><b>↵</b> show results</span><span><b>esc</b> back to the series</span></div></div>`;

const page = (crumb) => `<div class="page"><div class="series"><header class="series-top"><button type="button" class="crumb">${icon("back")}${crumb}</button><h1>Frieren: Beyond Journey's End</h1><div class="meta"><span class="tag src-tag">aniwave</span><span class="tag src-tag">hianime</span><span>Sousou no Frieren</span></div></header>
  <aside class="side"><div class="poster"></div></aside><div class="main"><div class="facts"><div><small>Format</small>TV · Fall 2023</div><div><small>Status</small>Finished</div><div><small>Available episodes</small>28</div><div><small>Studio</small>MADHOUSE</div><div><small>Score</small>9.1</div><div><small>Progress</small>Started 7</div></div><div class="lines"><i></i><i></i><i style="width:82%"></i></div></div></div></div>`;
const frame = (label, field, { open, palette = "", crumb = "Results for “frieren”" } = {}) => `<span class="state">${label}</span><div class="frame ${open ? "tall" : ""}"><header class="bar"><div class="brand"><button type="button" class="logo">ANI<em>desktop</em></button></div><div class="searchbox ${open ? "open" : ""}"><label class="search">${icon("search")}${field}</label>${palette}</div><nav class="icons">${["home", "browse", "bookmark", "clock", "gear"].map((n) => `<button type="button">${icon(n)}</button>`).join("")}</nav></header>${open ? '<div class="dim"></div>' : ""}${page(crumb)}</div>`;
const variant = (id, caption, frames) => `<p class="caption">${caption}</p><div class="variant" data-variant="${id}">${frames.join("")}</div>`;

document.body.insertAdjacentHTML("beforeend",
  variant("now", "<b>Today.</b> The series page keeps “frieren” in the field. A click focuses the field and nothing else happens, because the results panel only exists on Home. The first keystroke leaves the series page for Home.", [
    frame("After opening a result", `<span class="fake-input">frieren</span>${clear}`),
    frame("After clicking the field: a caret, no results", `<span class="fake-input">frieren<span class="caret"></span></span>${clear}`)]) +
  variant("q1", "<b>Q1 · The field reopens its results.</b> The field keeps the query, and a click (or ⌘K) drops the same results panel over the series page, straight from the cached search. The query is selected, so typing replaces it and searches in place. Escape or a click on the dimmed page closes the panel and the series page is still there. The series page closes only when another result is opened.", [
    frame("On the series page", `<span class="fake-input">frieren</span>${clear}`),
    frame("After clicking the field", `<span class="fake-input"><span class="sel">frieren</span></span>${clear}`, { open: true, palette: results() })]) +
  variant("q2", "<b>Q2 · The field resets, the search is one row away.</b> Opening a result empties the field, so the bar reads the same on every page. The way back stays in the “Results for” link. A click on the empty field offers the last search as a single row. Enter or a click on it brings the results panel back.", [
    frame("On the series page", `<span class="fake-input"><span class="ph">Search anime</span></span>${kbd}`),
    frame("After clicking the field", `<span class="fake-input"><span class="caret"></span><span class="ph">Search anime</span></span>`, { open: true, palette: recall })]) +
  variant("q3", "<b>Q3 · Q1 with the query at rest.</b> The kept query is muted and carries its result count, so it reads as a finished search you can return to, and the clear button appears only once the field is active. A click behaves exactly as in Q1. The “Results for” link above the title becomes plain “Home”, since the field now does that job.", [
    frame("On the series page", `<span class="fake-input rest">frieren</span><span class="count">3 results</span>`, { crumb: "Home" }),
    frame("After clicking the field", `<span class="fake-input"><span class="sel">frieren</span></span>${clear}`, { open: true, palette: results(), crumb: "Home" })])
);
</script>
