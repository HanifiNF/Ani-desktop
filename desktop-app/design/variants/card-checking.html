<!doctype html><meta charset="utf-8"><title>Card checking state · variants</title>
<style>
:root {
  --bg:#262626; --text:#EFE6D0; --cursor:#F0BC42; --cursor-text:#1d1a12;
  --raised: color-mix(in oklab, var(--bg), var(--text) 6%);
  --raised2: color-mix(in oklab, var(--bg), var(--text) 10%);
  --rule: color-mix(in oklab, var(--bg), var(--text) 12%);
  --dim: color-mix(in oklab, var(--bg), var(--text) 36%);
  --muted: color-mix(in oklab, var(--bg), var(--text) 60%);
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin:0; background:#151515; color:var(--text); font: 400 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing:-.005em; padding: 40px 0 80px; }
.caption { width: 1000px; margin: 56px 60px 12px; color: #8a8578; font-size: 12.5px; line-height: 1.55; }
.caption:first-child { margin-top: 0; }
.caption b { color: #d8cfba; font-weight: 600; }
.variant { width: 1120px; background: var(--bg); padding: 22px 60px 26px; }
.label { display: block; margin: 0 0 10px; color: #8a8578; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.label + .cards, .label + .frames { margin-bottom: 26px; }
.variant > :last-child { margin-bottom: 0; }

.cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px 16px; }
.card { position: relative; min-width: 0; transition: opacity .2s; }
.poster { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: var(--radius); overflow: hidden; background: var(--raised); box-shadow: 0 1px 0 color-mix(in oklab, var(--text) 8%, transparent) inset; }
.poster img { display: block; width: 100%; height: 100%; object-fit: cover; transition: filter .2s; }
.wrap { position: relative; display: block; border-radius: var(--radius); }
.badges { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 4px; flex-wrap: wrap; pointer-events: none; z-index: 2; }
.badges.top { top: 8px; bottom: auto; justify-content: flex-end; }
.badge { font-size: 11px; font-weight: 600; line-height: 1; padding: 5px 7px; border-radius: 6px; background: color-mix(in oklab, #000 62%, transparent); color: #fff; backdrop-filter: blur(6px); }
.badge.hi { background: var(--cursor); color: var(--cursor-text); }
.t { display: -webkit-box; min-height: calc(2 * 1.3em); margin-top: 10px; font-size: 14px; font-weight: 500; line-height: 1.3; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.s { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.hover .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.opening .card { opacity: .45; }
.opening .card.res { opacity: 1; }

/* Every animation reads --d (its own stagger) and --t (the frozen frame's time), so the film strips show real frames of the same motion. */
.frames { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px 16px; }
.frames .card { opacity: 1; }
.frames .card .t, .frames .card .s { display: none; }
.frames .card::after { content: attr(data-at); display: block; margin-top: 6px; color: #6f6a5f; font-size: 11px; }
.frames * , .frames *::before, .frames *::after { animation-play-state: paused !important; }

/* Now */
.now .res .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.now .res img { filter: brightness(.55); }
.now .dots { animation: blink 1s calc(var(--d, 0s) - var(--t, 0s)) infinite alternate; }
@keyframes blink { to { opacity: .3; } }

/* C1 · Edge trace: the selection ring itself becomes the indicator */
.c1 .res .wrap { padding: 2px; margin: -2px; border-radius: calc(var(--radius) + 2px); background: conic-gradient(from var(--a), color-mix(in oklab, var(--cursor) 28%, var(--bg)) 0 50%, var(--cursor) 88%, #fff6d8 97%, color-mix(in oklab, var(--cursor) 28%, var(--bg)) 100%); animation: trace 1.6s calc(var(--d, 0s) - var(--t, 0s)) linear infinite; }
.c1 .res img { filter: brightness(.78); }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes trace { to { --a: 360deg; } }

/* C2 · Bottom sweep: the studio-reading track, reused on the poster's lower edge */
.c2 .res .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.c2 .res img { filter: brightness(.6); }
.c2 .sweep { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in oklab, #000 50%, transparent); overflow: hidden; z-index: 2; }
.c2 .sweep i { position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--cursor); animation: sweep 1.4s calc(var(--d, 0s) - var(--t, 0s)) ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.c2 .res .s { color: var(--cursor); }

/* C3 · Source dots: one dot per source, each settles when that source answers */
.c3 .res .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.c3 .res img { filter: brightness(.55); }
.c3 .srcs { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; line-height: 1; padding: 6px 8px; border-radius: 6px; background: color-mix(in oklab, #000 62%, transparent); color: #fff; backdrop-filter: blur(6px); }
.c3 .srcs span { display: inline-flex; gap: 4px; }
.c3 .srcs i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .3; animation: wait 0.9s calc(var(--d, 0s) - var(--t, 0s)) ease-in-out infinite alternate; }
.c3 .srcs i.ok { opacity: 1; background: var(--cursor); animation: none; }
.c3 .srcs i:nth-child(2) { --d: .2s; } .c3 .srcs i:nth-child(3) { --d: .4s; }
@keyframes wait { to { opacity: .9; } }

/* C4 · Sheen: a soft band of light crosses the dimmed poster, no text at all */
.c4 .res .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.c4 .res img { filter: brightness(.5) saturate(.8); }
.c4 .sheen { position: absolute; inset: 0; z-index: 1; overflow: hidden; border-radius: var(--radius); }
.c4 .sheen::before { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 55%; background: linear-gradient(100deg, transparent, color-mix(in oklab, var(--text) 26%, transparent) 50%, transparent); transform: translateX(-120%) skewX(-12deg); animation: sheen 1.7s calc(var(--d, 0s) - var(--t, 0s)) cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes sheen { 0% { transform: translateX(-120%) skewX(-12deg); } 70%, 100% { transform: translateX(300%) skewX(-12deg); } }

/* C5 · Centre ring: a spinner in the middle of the poster with a quiet word under it */
.c5 .res .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.c5 .res img { filter: brightness(.4); }
.c5 .mid { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 10px; color: #fff; font-size: 11.5px; font-weight: 500; }
.c5 .ring { width: 26px; height: 26px; border-radius: 50%; border: 2px solid color-mix(in oklab, #fff 22%, transparent); border-top-color: var(--cursor); animation: spin .9s calc(var(--d, 0s) - var(--t, 0s)) linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* C6 · Glass pill: the badge kept, made quieter, with a small ring and a wave in the dots */
.c6 .res .wrap { box-shadow: 0 0 0 2px var(--cursor); }
.c6 .res img { filter: brightness(.6); }
.c6 .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; line-height: 1; padding: 5px 8px 5px 6px; border-radius: 999px; background: color-mix(in oklab, #000 62%, transparent); color: #fff; backdrop-filter: blur(6px); }
.c6 .pill .ring { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid color-mix(in oklab, #fff 25%, transparent); border-top-color: var(--cursor); animation: spin .8s calc(var(--d, 0s) - var(--t, 0s)) linear infinite; }
.c6 .wave { display: inline-flex; gap: 2px; margin-left: 1px; }
.c6 .wave i { width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .3; animation: wave 1.2s calc(var(--d, 0s) - var(--t, 0s)) infinite; }
.c6 .wave i:nth-child(2) { --d: .15s; } .c6 .wave i:nth-child(3) { --d: .3s; }
@keyframes wave { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
</style>

<body>
<script>
const cdn = "https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/";
const LIST = [
  ["Attack on Titan Season 2", "bx20958-HuFJyr54Mmir.jpg", "8.5", "TV · 2017 · 12 eps"],
  ["Solo Leveling Season 2 -Arise from the Shadow-", "bx176496-9BDMjAZGEbq4.png", "8.4", "TV · 2025 · 13 eps"],
  ["Chainsaw Man", "bx127230-DdP4vAdssLoz.png", "8.3", "TV · 2022 · 12 eps"],
  ["Mob Psycho 100", "bx21507-6YUSbh2m0N1p.jpg", "8.4", "TV · 2016 · 12 eps"],
  ["Fullmetal Alchemist: Brotherhood", "bx5114-nSWCgQlmOMtj.jpg", "9.0", "TV · 2009 · 64 eps"],
  ["Your Name.", "bx21519-SUo3ZQuCbYhJ.png", "8.5", "MOVIE · 2016"],
];
const card = ([t, c, score, s], cls = "", over = "", sub) => `<div class="card ${cls}"><span class="wrap"><span class="poster"><img src="${cdn + c}" alt=""><span class="badges top"><span class="badge">${score}</span></span>${over}</span></span><span class="t">${t}</span><span class="s">${sub ?? s}</span></div>`;
const before = () => `<span class="label">Before click · pointer on the card</span><div class="cards">${LIST.map((a, i) => card(a, i === 1 ? "hover" : "")).join("")}</div>`;
const after = (over, sub) => `<span class="label">After click · checking streaming sources (live, animated)</span><div class="cards opening">${LIST.map((a, i) => i === 1 ? card(a, "res", over, sub) : card(a)).join("")}</div>`;
const frames = (over, times) => `<span class="label">The same card over time · frozen frames</span><div class="frames">${times.map((at) => `<div class="card res" data-at="${at}" style="--t:${at}">${card(LIST[1], "res", over).replace(/^<div class="card res">|<\/div>$/g, "")}</div>`).join("")}</div>`;
const V = (id, cls, caption, over, times, sub) => `<p class="caption">${caption}</p><div class="variant ${cls}" data-variant="${id}">${id === "now" ? before() : ""}${after(over, sub)}${frames(over, times)}</div>`;

const T = ["0s", "0.3s", "0.6s", "0.9s", "1.2s", "1.5s"];
document.body.insertAdjacentHTML("beforeend",
  V("now", "now", `<b>Now</b> · A full-colour "checking ···" badge lands on the poster, the poster dims and the grid steps back. The badge is the loudest thing on the page and its only motion is the dots fading.`,
    `<span class="badges"><span class="badge hi">checking<span class="dots"> ···</span></span></span>`, T) +
  V("c1", "c1", `<b>C1 · Edge trace.</b> No badge and no text. The selection ring that already appears on hover becomes the indicator: a bright arc travels around the poster's edge. The poster dims only slightly, the rest of the grid steps back as it does today.`,
    ``, T) +
  V("c2", "c2", `<b>C2 · Bottom sweep.</b> The same moving track used for "Fetching a studio's catalog" runs along the poster's lower edge, so the app has one loading gesture. The words move off the art into the facts line under the title, in the highlight colour.`,
    `<span class="sweep"><i></i></span>`, T, "Checking sources…") +
  V("c3", "c3", `<b>C3 · Source dots.</b> A dark glass badge shows one dot per source (Aniwave, AniDB, HiAnime). Waiting dots pulse in sequence; a dot turns solid the moment its source answers. Says how far along the check is. Needs per-source progress from the resolver; the frames below show 0, 1 and 2 sources answered.`,
    `<span class="badges"><span class="srcs">Sources<span><i></i><i></i><i></i></span></span></span>`, T) +
  V("c4", "c4", `<b>C4 · Sheen.</b> Wordless. The poster dims and a soft band of light crosses it about every 1.7 s, like a skeleton shimmer over the real art. Ring stays solid.`,
    `<span class="sheen"></span>`, T) +
  V("c5", "c5", `<b>C5 · Centre ring.</b> The poster dims further and a small spinner sits in the middle with one quiet word under it. The most conventional option, and the easiest to read at a glance in a dense grid.`,
    `<span class="mid"><span class="ring"></span>Checking sources</span>`, T) +
  V("c6", "c6", `<b>C6 · Glass pill.</b> Closest to today. The badge stays bottom left and turns into the dark glass used by the score badge, with a tiny highlight-coloured ring and dots that rise in a wave.`,
    `<span class="badges"><span class="pill"><span class="ring"></span>Checking<span class="wave"><i></i><i></i><i></i></span></span></span>`, T));

// C3's frozen frames also step through answered sources.
document.querySelectorAll(".c3 .frames .card").forEach((el, i) => { const dots = el.querySelectorAll(".srcs i"); if (i >= 2) dots[0].classList.add("ok"); if (i >= 4) dots[1].classList.add("ok"); });
// Live C3 card: sources answer one after another, then the loop restarts.
const live = document.querySelectorAll(".c3 .cards .srcs i");
let step = 0; setInterval(() => { step = (step + 1) % 4; live.forEach((d, i) => d.classList.toggle("ok", i < step - 0 && step < 4 && i < step)); }, 1100);
</script>
</body>
