<!doctype html><meta charset="utf-8"><title>Schedule · C variants, atsu styling</title>
<style>
:root { --bg:#1D1E20; --text:#F9F8F6; --muted:#B8BCC0; --dim:#7A7E83; --raised:#313234; --raised2:#3a3b3e; --rule:#2c2d30; --poster:#282828; --blue:#038CFC; --radius:12px; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font: 14px/1.5 -apple-system, "Inter", system-ui, sans-serif; padding: 40px 60px 80px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.caption { margin: 48px 0 10px; color: var(--dim); font-size: 12px; }
.caption:first-child { margin-top: 0; }
.variant { width: 1120px; padding: 12px 0 8px; }

/* atsu section header */
.head { display:flex; align-items:center; gap: 12px; margin-bottom: 16px; }
.head h2 { margin:0; font-size: 24px; font-weight: 400; letter-spacing: 0; display:flex; align-items:center; gap: 10px; line-height: 32px; }
.head h2 svg { width: 9px; height: 14px; color: var(--muted); }
.head .sub { color: var(--dim); font-size: 13px; margin-top: 3px; }
.head .right { margin-left:auto; display:flex; align-items:center; gap: 12px; }
.segw { display:flex; gap: 4px; padding: 2px; border-radius: 8px; background: var(--raised); }
.segw button { padding: 4px 14px; border-radius: 6px; font-size: 14px; color: var(--muted); line-height: 22px; }
.segw button.on { color: var(--text); background: var(--bg); }
.segw.plain button.on { background: none; }
.segw button.today { position: relative; }
.segw button.today::after { content:""; position:absolute; left: 50%; bottom: 2px; width: 3px; height: 3px; margin-left:-1.5px; border-radius: 50%; background: currentColor; opacity: .7; }
.foot { display:flex; justify-content:flex-end; align-items:center; gap: 12px; margin-top: 18px; }
.foot .more { color: var(--muted); font-size: 15px; display:flex; align-items:center; gap: 8px; padding: 6px 8px; }
.foot .all { display:flex; align-items:center; gap: 8px; padding: 6px 12px 6px 14px; border-radius: 8px; background: var(--raised); font-size: 15px; }
.foot svg { width: 10px; height: 14px; }

/* atsu card */
.poster { border-radius: var(--radius); background: var(--poster); box-shadow: none; }
.pill { position:absolute; left: 4px; bottom: 4px; display:flex; align-items:center; border-radius: 999px; background: rgba(0,0,0,.72); padding: 2px; z-index: 2; font-size: 10px; font-weight: 700; line-height: 1; color: #fff; }
.pill span { padding: 4px 7px; }
.pill .type { border-radius: 999px; background: var(--blue); padding: 4px 8px; }
.pill .type.grey { background: #5f6368; }
.pill .type.sub { background: #6A4CF1; }
.pill .sep { width: 1px; height: 10px; padding: 0; background: rgba(255,255,255,.18); }
.card { display:grid; align-content:start; width:100%; min-width:0; text-align:left; }
.wk > div, .rail .col { min-width: 0; }
.pill span { white-space: nowrap; }
.card .t { display:block; margin-top: 8px; font-size: 14px; font-weight: 400; line-height: 21px; color: var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .s { display:block; font-size: 12px; color: var(--dim); line-height: 18px; }
.card:hover .t { color: var(--text); }
.card:hover .poster { outline: 2px solid var(--text); outline-offset: 0; }
.card.past .poster { opacity: .5; }
.card.past .t { color: var(--dim); }
.grid6 { display:grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 16px; }

/* C4 · week columns of cards */
.wk { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 16px; }
.wk h4 { margin: 0 0 10px; font-size: 14px; font-weight: 400; color: var(--muted); display:flex; align-items:baseline; gap: 6px; }
.wk h4 span { color: var(--dim); font-size: 12px; }
.wk .today h4 { color: var(--text); }
.wk .card + .card { margin-top: 14px; }
.wk .more { display:block; margin-top: 10px; color: var(--dim); font-size: 13px; }
.wk .none { color: var(--dim); font-size: 13px; margin-top: 4px; }

/* C5 · today grid + rest of week text */
.rest { display:grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule); }
.rest h4 { margin: 0 0 6px; font-size: 14px; font-weight: 400; color: var(--muted); }
.rest h4 span { color: var(--dim); font-size: 12px; margin-left: 6px; }
.rest .e { display:block; text-align:left; padding: 4px 0; }
.rest .e b { display:block; font-weight: 400; font-size: 13px; color: var(--muted); line-height: 18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rest .e:hover b { color: var(--text); }
.rest .e small { color: var(--dim); font-size: 12px; }

/* C7 · week rail of card columns */
.rail { display:flex; gap: 16px; overflow:hidden; position: relative; }
.rail .col { flex:none; width: 173px; }
.rail h4 { margin: 0 0 10px; font-size: 16px; font-weight: 400; display:flex; align-items:center; gap: 8px; }
.rail h4 svg { width: 8px; height: 12px; color: var(--muted); }
.rail h4 span { color: var(--dim); font-size: 12px; margin-left: auto; }
.rail .col:not(.today) h4 { color: var(--muted); }
.rail .card + .card { margin-top: 14px; }
.rail .fade { position:absolute; right:0; top:0; bottom:0; width: 90px; background: linear-gradient(90deg, transparent, var(--bg)); pointer-events:none; }
/* posters */
.poster { display:block; position:relative; aspect-ratio: 2/3; border-radius: var(--radius); overflow:hidden; background: var(--raised); box-shadow: 0 1px 0 color-mix(in oklab, var(--text) 8%, transparent) inset; }
.poster::after { content:""; position:absolute; inset:0; }
.p1 { background:#d7e3ee; } .p1::after { background: linear-gradient(165deg, transparent 52%, #1b2a3d 52%); box-shadow: 0 0 0 200px transparent; }
.p1::before { content:""; position:absolute; left:32%; top:12%; width:60%; aspect-ratio:1; border-radius:50%; background:#5c85b4; }
.p2 { background:#f6e64a; } .p2::before { content:""; position:absolute; left:14%; top:16%; width:42%; aspect-ratio:1; border-radius:50%; background:#e5383b; } .p2::after { inset:auto 18% 34% 18%; height:12%; background:#111; }
.p3 { background:#efd9b5; } .p3::after { background: linear-gradient(170deg, transparent 38%, #4a7a45 38%); } .p3::before { content:""; position:absolute; left:28%; top:40%; width:48%; aspect-ratio:1; border-radius:50%; background:#3a2418; z-index:1; }
.p4 { background:#f5e2ea; } .p4::before { content:""; position:absolute; left:12%; top:16%; width:50%; aspect-ratio:1; background:#b5546e; } .p4::after { inset:auto 14% 22% 44%; aspect-ratio:1; background:#4f7d64; opacity:.85; }
.p5 { background:#d5dde2; } .p5::before { content:""; position:absolute; left:14%; top:14%; width:36%; aspect-ratio:1; background:#3f5666; } .p5::after { inset:auto 14% 18% 40%; aspect-ratio:1; background:#b3472f; }
.p6 { background:#2b2f3a; } .p6::before { content:""; position:absolute; left:20%; top:30%; width:60%; aspect-ratio:1; border-radius:50%; background:#7fb2ff; }
.p7 { background:#e6efe0; } .p7::after { background: linear-gradient(200deg, transparent 55%, #2f6b4f 55%); } .p7::before { content:""; position:absolute; right:10%; top:10%; width:34%; aspect-ratio:1; background:#f2b134; z-index:1; }
.p8 { background:#4b6fd6; } .p8::before { content:""; position:absolute; left:18%; top:20%; width:64%; aspect-ratio:1; background:#fff; opacity:.9; border-radius:8px; }
.poster { display:block; position:relative; aspect-ratio: 2/3; overflow:hidden; }
</style>
<script>
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const items = [
  { p:"p6", t:"Kaiju No. 8", ep:10, time:"01:30", past:true, eta:"aired" },
  { p:"p7", t:"Wind Breaker", ep:21, time:"09:00", past:true, eta:"aired" },
  { p:"p8", t:"Oshi no Ko", ep:7, time:"12:30", past:true, eta:"aired" },
  { p:"p1", t:"Frieren: Beyond Journey's End", ep:13, time:"16:30", past:true, eta:"aired" },
  { p:"p2", t:"Dandadan", ep:4, time:"19:00", eta:"in 1h 30m" },
  { p:"p4", t:"The Apothecary Diaries", ep:8, time:"21:15", eta:"in 3h 45m" },
  { p:"p3", t:"Sakamoto Days", ep:11, time:"22:00", eta:"in 4h 30m" },
  { p:"p5", t:"Blue Box", ep:15, time:"23:30", eta:"in 6h" }
];

const chevS = '<svg viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5.5 5.5-5.5 5.5"/></svg>';
const down = '<svg viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 5 4.5 4.5L10.5 5"/></svg>';
const head = (title, sub, right) => `<div class="head"><h2>${title}${chevS}</h2><span class="sub">${sub}</span><div class="right">${right}</div></div>`;
const foot = (more) => `<div class="foot">${more ? `<button class="more">See more ${down}</button>` : ''}<button class="all">See all ${chevS}</button></div>`;
const audio = () => `<div class="segw plain"><button class="on">SUB</button><button>DUB</button></div>`;
const dayseg = () => `<div class="segw">${days.map((d, i) => `<button class="${i===1?'on today':''}">${d}</button>`).join("")}</div>`;
const pill = (x, live) => `<span class="pill"><span class="type ${live ? '' : 'grey'}">${x.time}</span><span>EP ${x.ep}</span></span>`;
const card = (x, live, sub) => `<button class="card ${live === false ? 'past' : ''}"><span class="poster ${x.p}">${pill(x, live)}</span><span class="t">${x.t}</span>${sub ? `<span class="s">${sub}</span>` : ''}</button>`;
const perDay = [[items[2], items[6]], items, [items[0], items[4], items[7]], [items[3]], [items[1], items[5], items[2]], [items[4], items[6]], [items[7], items[0], items[1], items[3]]];
const order = [1,2,3,4,5,6,0];

const C4 = `<div class="variant" data-variant="c4">
  ${head("This week", "Summer 2026 · estimated, GMT+10", audio())}
  <div class="wk">${days.map((d, i) => { const xs = perDay[i]; const show = xs.slice(0, 3); return `<div class="${i===1?'today':''}"><h4>${i===1?'Today':d}<span>${13+i} Sept</span></h4>${show.map(x => card(x, i!==1 || !x.past)).join("")}${xs.length > 3 ? `<button class="more">+${xs.length - 3} more</button>` : ''}</div>`; }).join("")}</div>
  ${foot(false)}
</div>`;

const C5 = `<div class="variant" data-variant="c5">
  ${head("Today", "Mon 14 Sept · estimated, GMT+10", audio())}
  <div class="grid6">${items.slice(2).map(x => card(x, !x.past, x.past ? 'Aired' : x.eta)).join("")}</div>
  <div class="rest">${order.slice(1).map(i => `<div><h4>${days[i]}<span>${13+i} Sept</span></h4>${perDay[i].map(x => `<button class="e"><b>${x.t}</b><small>${x.time} · EP ${x.ep}</small></button>`).join("")}</div>`).join("")}</div>
  ${foot(true)}
</div>`;

const C6 = `<div class="variant" data-variant="c6">
  ${head("Schedule", "Summer 2026 · estimated, GMT+10", dayseg() + audio())}
  <div class="grid6">${items.slice(2).map(x => card(x, !x.past, x.past ? 'Aired' : x.eta)).join("")}</div>
  ${foot(true)}
</div>`;

const C7 = `<div class="variant" data-variant="c7">
  ${head("This week", "Summer 2026 · estimated, GMT+10", audio())}
  <div class="rail">${order.map(i => `<div class="col ${i===1?'today':''}"><h4>${i===1?'Today':days[i]}${chevS}<span>${13+i} Sept</span></h4>${perDay[i].slice(0, 3).map(x => card(x, i!==1 || !x.past, i===1 ? (x.past ? 'Aired' : x.eta) : '')).join("")}</div>`).join("")}<div class="fade"></div></div>
</div>`;

document.write(
  `<div class="caption">C4 · Week columns of atsu cards — seven columns, up to three posters each, pill badge bottom-left, muted regular titles</div>` + C4 +
  `<div class="caption">C5 · Today as an atsu card row, the rest of the week as a text strip underneath</div>` + C5 +
  `<div class="caption">C6 · atsu day switcher — segmented day control in the header (like Daily / Weekly), six-across card grid, See more / See all footer</div>` + C6 +
  `<div class="caption">C7 · Week rail — each day is a mini atsu section heading with a chevron, cards stack under it, later days trail off</div>` + C7
);
</script>
