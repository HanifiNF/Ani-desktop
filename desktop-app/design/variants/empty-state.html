<!doctype html><meta charset="utf-8"><title>Empty state · variants</title>
<style>
:root {
  --bg:#1F2023; --text:#EDEDEE; --cursor:#EDEDEE; --cursor-text: var(--bg);
  --raised: color-mix(in oklab, var(--bg), var(--text) 6%);
  --raised2: color-mix(in oklab, var(--bg), var(--text) 10%);
  --rule: color-mix(in oklab, var(--bg), var(--text) 12%);
  --dim: color-mix(in oklab, var(--bg), var(--text) 36%);
  --muted: color-mix(in oklab, var(--bg), var(--text) 60%);
  --radius: 10px; --gutter: 60px; --cols: 8;
}
* { box-sizing: border-box; }
body { margin:0; background:#111; color:var(--text); font: 400 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing:-.005em; padding: 40px; }
button, a { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; text-align: left; }
kbd { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); padding: 5px 7px; border-radius: 6px; background: var(--bg); border: 1px solid var(--rule); }
.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.caption { margin: 48px 0 10px; color: #777; font-size: 12px; }
.caption:first-child { margin-top: 0; }
.caption b { color: #bbb; font-weight: 600; }

/* ---- window frame ---- */
.frame { width: 1240px; height: 800px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 68px; padding: 0 var(--gutter); flex: none; }
.logo { font-weight: 700; font-size: 19px; letter-spacing: .06em; color: var(--text); }
.logo em { font-style: normal; color: var(--muted); font-weight: 500; }
.searchbox { width: 420px; }
.search { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px 0 16px; border-radius: 12px; background: var(--raised); color: var(--muted); }
.search span { flex: 1; font-size: 15px; color: var(--dim); }
.icons { display: flex; justify-content: flex-end; gap: 4px; }
.icons > button { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--muted); }
.icons > button.on { color: var(--text); background: var(--raised); }
.page { flex: 1; min-height: 0; overflow: hidden; padding: 8px var(--gutter) 40px; display: flex; flex-direction: column; }
.section { margin-top: 24px; }
.section:first-child { margin-top: 12px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.section-head h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.section-head .count { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 18px 16px; }
.card { position: relative; min-width: 0; }
.poster { position: relative; aspect-ratio: 2 / 3; border-radius: var(--radius); background: var(--raised); overflow: hidden; box-shadow: 0 1px 0 color-mix(in oklab, var(--text) 8%, transparent) inset; }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badges { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px; }
.badge { font-size: 11px; font-weight: 600; line-height: 1; padding: 5px 7px; border-radius: 6px; background: color-mix(in oklab, #000 62%, transparent); color: #fff; }
.card .t { display: block; min-height: calc(2 * 1.3em); margin-top: 10px; font-size: 14px; font-weight: 500; line-height: 1.3; }
.card .s { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.upcoming .poster { filter: brightness(.5) saturate(.55); }
.upcoming .t { color: var(--muted); }
.tags { display: flex; gap: 4px; margin-top: 6px; }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--raised); color: var(--muted); font-size: 10.5px; }
.tag.more { color: var(--text); }
.schedule-sub { color: var(--muted); font-size: 13px; }
.schedule-days { display: flex; gap: 16px; margin-left: auto; }
.schedule-days button { position: relative; padding: 2px 0; color: var(--muted); font-size: 14px; }
.schedule-days button.on { color: var(--text); font-weight: 500; }
.schedule-days button.today::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--text); }
.schedule-audio { display: flex; gap: 12px; margin-left: 22px; padding-left: 22px; border-left: 1px solid var(--rule); }
.schedule-audio button { color: var(--muted); font-size: 13px; font-weight: 500; }
.schedule-audio button.on { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 500; background: var(--raised); color: var(--text); }
.btn.primary { background: var(--cursor); color: var(--cursor-text); }
.btn.primary kbd { background: color-mix(in oklab, var(--cursor), #000 10%); border-color: color-mix(in oklab, var(--cursor), #000 18%); color: var(--cursor-text); }
.btn.small { height: 30px; padding: 0 12px; font-size: 13px; }
.btn .icon { width: 16px; height: 16px; }
.linkish { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.linkish .icon { width: 14px; height: 14px; }
.site-footer { margin-top: auto; padding: 32px 36px 24px; border-radius: 16px; background: var(--raised); flex: none; }
.page > :has(+ .site-footer) { margin-bottom: 48px; }
.footer-columns { display: grid; grid-template-columns: 1.4fr 1fr 1.4fr; gap: 40px; }
.footer-about p { margin: 12px 0 0; max-width: 320px; color: var(--muted); line-height: 1.55; }
.footer-about p a { color: var(--text); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
.footer-group h4 { margin: 0 0 12px; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.footer-link { display: flex; align-items: center; gap: 12px; padding: 7px 0; color: var(--muted); }
.footer-link .icon { width: 17px; height: 17px; }
.footer-link.on { color: var(--text); }
.creator { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
.creator-portrait { width: 36px; height: 36px; border-radius: 50%; background: var(--raised2); display: grid; place-items: center; color: var(--muted); font-weight: 600; }
.creator b { display: block; font-weight: 500; }
.creator-socials { display: flex; gap: 8px; margin-top: 3px; color: var(--muted); }
.creator-socials .icon { width: 15px; height: 15px; }

/* ---- current ---- */
.empty { padding: 40px 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.empty b { display: block; color: var(--text); font-weight: 600; font-size: 15px; margin-bottom: 4px; }

/* ---- A · ghost row: the empty library keeps the shape of a full one ---- */
.ghosts { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 18px 16px; }
.ghost { position: relative; overflow: hidden; aspect-ratio: 2 / 3; border-radius: var(--radius); background: var(--raised); }
.ghost-row { -webkit-mask-image: linear-gradient(90deg, #000 30%, transparent 96%); mask-image: linear-gradient(90deg, #000 30%, transparent 96%); }
.start-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; aspect-ratio: 2 / 3; border-radius: var(--radius); background: var(--raised); color: var(--muted); border: 1px dashed color-mix(in oklab, var(--bg), var(--text) 22%); }
.start-tile:hover { color: var(--text); background: var(--raised2); }
.start-tile .icon { width: 22px; height: 22px; }
.start-tile span { font-size: 13px; font-weight: 500; }
.start-tile.on { border-style: solid; border-color: transparent; }
.ghost-note { margin-top: 16px; color: var(--muted); font-size: 13px; }
.ghost-note b { color: var(--text); font-weight: 600; margin-right: 8px; }

/* ---- B · centred ---- */
.centre { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 64px 0 56px; }
.centre .ring { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; color: var(--muted); margin-bottom: 16px; }
.centre .ring .icon { width: 20px; height: 20px; }
.centre h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.centre p { margin: 6px 0 0; color: var(--muted); max-width: 44ch; }
.centre .acts { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
.centre .acts .linkish { color: var(--muted); }
.centre.tall { padding: 96px 0 80px; }

/* ---- C · strip ---- */
.strip { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); color: var(--muted); }
.strip b { color: var(--text); font-weight: 600; }
.strip .sep { color: var(--dim); }
.strip .btn { margin-left: auto; }
.strip.soft { border: 0; padding: 14px 18px; border-radius: 12px; background: var(--raised); }
.strip.soft .btn { background: var(--raised2); }
.strip.soft kbd { background: var(--raised); }
.strip .icon { width: 16px; height: 16px; color: var(--dim); }

/* ---- D · schedule first ---- */
.lead { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 13px; }
.lead kbd { font-size: 10px; padding: 3px 5px; }
.lead .icon { width: 15px; height: 15px; color: var(--dim); }

/* ---- E · steps panel ---- */
.steps { margin-top: 12px; padding: 26px 30px 24px; border-radius: 16px; background: var(--raised); }
.steps-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.steps-head h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.steps-head span { color: var(--muted); font-size: 13px; }
.steps ol { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--raised2); color: var(--muted); font-size: 12px; font-weight: 600; }
.steps b { display: block; font-weight: 600; font-size: 14px; }
.steps p { margin: 3px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.steps .btn { background: var(--raised2); }
.steps .btn kbd { background: var(--raised); }

/* ---- F · big search ---- */
.hero { display: flex; flex-direction: column; align-items: center; padding: 60px 0 48px; }
.hero h3 { margin: 0 0 18px; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.hero .field { display: flex; align-items: center; gap: 14px; width: 560px; height: 52px; padding: 0 14px 0 18px; border-radius: 14px; background: var(--raised); color: var(--muted); box-shadow: 0 0 0 1px var(--rule); }
.hero .field span { flex: 1; font-size: 16px; color: var(--dim); }
.hero .field .icon { width: 20px; height: 20px; }
.hero .foot { margin-top: 14px; color: var(--dim); font-size: 12px; }
.hero .foot b { color: var(--muted); font-weight: 500; }
.hero.bare .field { box-shadow: none; }
.bar.quiet .searchbox { visibility: hidden; }

/* ---- fun takes on the ghost row ---- */
.ghosts .gcard { min-width: 0; }
.gcard > .start-tile { width: 100%; }
.gcard .ghost { position: relative; }
.gcard .gt { display: block; margin-top: 10px; font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--dim); min-height: calc(2 * 1.3em); }
.gcard .gs { display: block; margin-top: 3px; font-size: 12px; color: color-mix(in oklab, var(--bg), var(--text) 26%); }
.gbadge { position: absolute; left: 8px; bottom: 8px; font-size: 11px; font-weight: 600; line-height: 1; padding: 5px 7px; border-radius: 6px; background: var(--raised2); color: var(--dim); }
/* terminal tile */
.term-tile { align-items: flex-start; justify-content: flex-start; padding: 14px; font: 500 17px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; gap: 6px; }
.term-tile .prompt { color: var(--muted); }
.term-tile .cursor { display: inline-block; width: .6em; height: 1.05em; vertical-align: text-bottom; background: var(--muted); }
@keyframes blink { to { visibility: hidden; } }
.term-tile .hint { margin-top: auto; font: 500 12px/1.4 Inter, system-ui, sans-serif; color: var(--dim); }
.term-tile .hint b { color: var(--muted); font-weight: 500; }
/* faint poster-like shapes */
.shape { position: absolute; inset: 0; color: color-mix(in oklab, var(--bg), var(--text) 13%); }
.shape svg { width: 100%; height: 100%; }
/* tilted deal */
.deal .ghost { transform-origin: 30% 120%; }
.deal > :nth-child(2) .ghost { transform: rotate(-1.4deg); }
.deal > :nth-child(3) .ghost { transform: rotate(-2.8deg); }
.deal > :nth-child(4) .ghost { transform: rotate(-4.2deg); }
.deal > :nth-child(5) .ghost { transform: rotate(-5.6deg); }
.deal > :nth-child(6) .ghost { transform: rotate(-7.0deg); }
.deal > :nth-child(7) .ghost { transform: rotate(-8.4deg); }
.deal > :nth-child(8) .ghost { transform: rotate(-9.8deg); }
/* doodles */
.doodle { position: absolute; inset: 0; display: grid; place-items: center; color: color-mix(in oklab, var(--bg), var(--text) 30%); }
.doodle svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.fun-note { margin-top: 16px; color: var(--muted); font-size: 13px; }
.fun-note b { color: var(--text); font-weight: 600; margin-right: 8px; }
.wink { color: var(--dim); }
/* peek: blurred schedule art */
.peek img { width: 100%; height: 100%; object-fit: cover; display: block; filter: blur(14px) brightness(.35) saturate(.6); transform: scale(1.15); }
.peek .glabel { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: var(--dim); }

/* ---- art tiles: images from nekosapi.com (design/shots/nekos, downloaded, not committed) ---- */
.art-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art-row.dimmed .art-tile img { filter: brightness(.55) saturate(.7); }
.art-row.shy .art-tile img { filter: grayscale(1) brightness(.5) contrast(.9); }
.art-row.shy .art-tile.hover img { filter: none; }
.art-row.shy .art-tile.hover { box-shadow: 0 0 0 2px var(--rule); }
.art-credit { color: var(--dim); font-size: 11px; margin-left: auto; }
.fun-note.with-credit { display: flex; align-items: baseline; gap: 6px; }
.start-tile.art { position: relative; border: 0; overflow: hidden; padding: 0; justify-content: flex-end; align-items: stretch; }
.start-tile.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.8); }
.start-tile.art .lab { position: relative; display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px; background: linear-gradient(transparent, rgb(0 0 0 / 75%)); color: #fff; font-size: 13px; font-weight: 500; padding-top: 40px; }
.start-tile.art .lab .icon { width: 16px; height: 16px; }
.companion .gt { color: var(--text); }
.companion .gs { color: var(--muted); white-space: normal; }

/* ---- backdrop art: the tiles stay ghostly, the art sits behind at low opacity ---- */
.frame { position: relative; }
.frame > .bar, .frame > .page { position: relative; z-index: 1; }
.backdrop { position: absolute; z-index: 0; pointer-events: none; overflow: hidden; }
.backdrop img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* B1: a wash across the top section, fading down before the schedule */
.backdrop.wash { left: 0; right: 0; top: 0; height: 520px; opacity: .14; -webkit-mask-image: linear-gradient(#000 40%, transparent 100%); mask-image: linear-gradient(#000 40%, transparent 100%); }
.backdrop.wash img { filter: saturate(.8); object-position: center 30%; }
/* B2: a character peeking from the top-right corner, behind the fading end of the ghost row */
.backdrop.corner { right: 0; top: 0; width: 520px; height: 620px; opacity: .55; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 85% 30%, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse 70% 70% at 85% 30%, #000 20%, transparent 70%); }
.backdrop.corner img { filter: brightness(.7) saturate(.85); object-position: center top; }
/* B3: a blurred colour wash, no readable art */
.backdrop.glow { left: -80px; right: -80px; top: -80px; height: 620px; opacity: .32; filter: blur(70px) saturate(1.2); -webkit-mask-image: linear-gradient(#000 50%, transparent 100%); mask-image: linear-gradient(#000 50%, transparent 100%); }
/* B4: window tiles; the art shows only through the outlined ghost tiles */
.windows .ghost { background: none; border: 1px solid color-mix(in oklab, var(--bg), var(--text) 14%); }
.windows .ghost::before { content: ""; position: absolute; inset: 0; background-image: var(--art); background-size: 1120px auto; background-position: var(--x) 30%; opacity: .28; filter: saturate(.85); }
/* B5: a wallpaper in the window's bottom-right corner, behind everything */
.backdrop.wallpaper { right: 0; bottom: 0; width: 640px; height: 640px; opacity: .12; -webkit-mask-image: radial-gradient(ellipse 80% 80% at 100% 100%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 80% 80% at 100% 100%, #000 30%, transparent 75%); }
.backdrop.wallpaper img { object-position: center 20%; }
.backdrop-credit { position: absolute; right: var(--gutter); bottom: 12px; z-index: 1; color: var(--dim); font-size: 11px; }

/* ---- credit placements ---- */
.foot-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; padding-top: 18px; border-top: 1px solid color-mix(in oklab, var(--raised), var(--text) 8%); color: var(--dim); font-size: 12px; }
.foot-line a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--dim), transparent 50%); text-underline-offset: 2px; }
.credit-caption { position: absolute; right: var(--gutter); top: 74px; z-index: 2; color: var(--dim); font-size: 11px; }
.credit-caption a, .credit-pin a, .footer-about .credit a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--dim), transparent 50%); text-underline-offset: 2px; }
.credit-pin { position: absolute; right: 14px; bottom: 10px; z-index: 2; color: var(--dim); font-size: 11px; opacity: .8; }
.footer-about .credit { color: var(--dim); font-size: 12px; }
</style>

<script>
const svgPoster = (bg, shapes) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect width="200" height="300" fill="${bg}"/>${shapes}</svg>`)}`;
const posters = {
  frieren: svgPoster("#DCE9F2", '<circle cx="120" cy="80" r="70" fill="#4F7BA6" opacity=".9"/><path d="M0 160 L200 110 L200 300 L0 300Z" fill="#1E2B3A"/>'),
  dandadan: svgPoster("#F5E64A", '<circle cx="70" cy="90" r="45" fill="#E23A3A"/><rect x="40" y="150" width="120" height="30" fill="#111"/>'),
  apothecary: svgPoster("#F3E4E8", '<rect x="20" y="40" width="110" height="120" fill="#B8556E"/><rect x="90" y="120" width="90" height="90" fill="#3B6B58" opacity=".85"/>')
};
const ic = (name) => `<svg class="icon"><use href="#${name}"/></svg>`;
const K = `<kbd>⌘K</kbd>`;

const bar = (on, placeholder = "Search anime", extra = "") => `
<header class="bar ${extra}">
  <div class="brand"><span class="logo">ANI<em>desktop</em></span></div>
  <div class="searchbox"><div class="search">${ic("search")}<span>${placeholder}</span>${K}</div></div>
  <nav class="icons">
    <button class="${on === "home" ? "on" : ""}">${ic("home")}</button>
    <button class="${on === "saved" ? "on" : ""}">${ic("bookmark")}</button>
    <button class="${on === "recent" ? "on" : ""}">${ic("clock")}</button>
    <button>${ic("gear")}</button>

const card = (poster, title, when, ep) => `
<div class="card upcoming">
  <div class="poster"><img src="${poster}"><div class="badges"><span class="badge">EP ${ep}</span></div></div>
  <span class="t">${title}</span><span class="s">${when}</span>
  <div class="tags"><span class="tag">Adventure</span><span class="tag more">+2</span></div>
</div>`;

const schedule = `
<section class="section section-schedule">
  <div class="section-head"><h2>Schedule</h2><span class="schedule-sub">Summer 2026 · estimated release times · GMT+10</span>
    <div class="schedule-days">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d) => `<button class="${d === "Wed" ? "on today" : ""}">${d}</button>`).join("")}</div>
    <div class="schedule-audio"><button class="on">SUB</button><button>DUB</button></div>
  </div>
  <div class="cards">
    ${card(posters.frieren, "Frieren: Beyond Journey's End", "16:30 · in 10h", 13)}
    ${card(posters.dandadan, "Dandadan", "19:00 · in 13h", 4)}
    ${card(posters.apothecary, "The Apothecary Diaries", "21:15 · in 15h", 8)}

</section>`;
